<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ site.url }}/css/style.css">
    {% seo %}
  </head>
  <body>
    
    <div class="wrapper">
      <section>
        <div id="title">
          <a href="/"><h1>{{ site.title }}</h1></a>
          <p>{{ site.description }}</p>
          
          <div style="text-align: center; margin-bottom: 20px;">
            {% if site.author.avatar %}
            <img src="{{ site.url }}{{ site.author.avatar }}" alt="Avatar" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin-bottom: 15px;">
            {% endif %}
          </div>

          <span><a style="padding: 15px;" href="{{ site.url }}/">Home</a></span>
          <span><a style="padding: 15px;" href="{{ site.url }}/about">About</a></span>
          <span><a style="padding: 15px;" href="{{ site.url }}/blog_posts">Posts</a></span>
          
          <hr>
          <span class="credits left">Maintained by <a href="https://github.com/{{ site.github_username }}">{{ site.title }}</a></span>
          <span class="credits right">Hosted on GitHub Pages</span>
        </div>

        {{ content }}

      </section>
    </div>

  </body>
</html>
