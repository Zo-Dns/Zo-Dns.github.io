<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ site.url }}/css/style.css">
    {% seo %}
  </head>
  <body>

    <!-- Top Navigation Bar -->
    <header class="top-header">
      <div class="header-container">
        <div class="header-brand">
          <a href="{{ site.url }}/">
            <h1>{{ site.title }}</h1>
            <p>{{ site.description }}</p>
          </a>
        </div>
        <nav class="header-nav">
          <a href="{{ site.url }}/about">About</a>
          <a href="{{ site.url }}/blog_posts">Posts</a>
        </nav>
      </div>
    </header>

    <!-- Main Page Layout -->
    <div class="main-container">
      
      <!-- Sidebar Left -->
      <aside class="sidebar">
        <div class="author-profile">
          <img src="{{ site.url }}/assets/images/avatar.png" alt="Avatar" class="profile-avatar">
          <h2>Zo-Dns</h2>
          <p class="author-bio">Security Researcher | Threat Research, Malware Analysis, RE, DFIR</p>
          
          <ul class="author-links">
            <li>📍 Finland</li>
            <li>🔗 <a href="https://github.com/Zo-Dns" target="_blank">GitHub</a></li>
          </ul>
        </div>
      </aside>

      <!-- Main Content Area Right -->
      <main class="content-area">
        {{ content }}
      </main>

    </div>

  </body>
</html>
